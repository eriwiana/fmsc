default_language_version:
  python: python3.12
# Commits stay fast, pushes stay safe: the suite runs on pre-push, not pre-commit.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
      - id: end-of-file-fixer
      - id: name-tests-test
        # Keep pytest's own convention (test_*.py), not the _test.py default.
        args: ['--pytest-test-first']
      - id: trailing-whitespace
  - repo: 'https://github.com/astral-sh/ruff-pre-commit'
    rev: v0.16.10
    hooks:
      # Lint and import order, replacing flake8 + bugbear + comprehensions + simplify
      # and isort. Rules and settings come from pyproject.toml so a local `ruff check`
      # matches CI.
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest (requires Postgres on DATABASE_URL)
        # `uv run` resolves the project environment itself, so the hook works
        # without a virtualenv being activated first.
        entry: uv run --extra dev pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
