default_language_version:
  python: python3.12
# Commits stay fast, pushes stay safe: the suite runs on pre-push, not pre-commit.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
      - id: end-of-file-fixer
      - id: name-tests-test
        # Keep pytest's own convention (test_*.py), not the _test.py default.
        args: ['--pytest-test-first']
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Lint and import order, replacing flake8 + bugbear + comprehensions + simplify
      # and isort. Rules and settings come from pyproject.toml.
      #
      # The project's own ruff, through `uv run`, rather than the mirror repo fetching its
      # own: two pins that have to agree are one pin too many, and the one that drifts is
      # the one nobody ran. `uv run` resolves the project environment itself, so the hook
      # works without a virtualenv being activated first.
      - id: ruff-check
        name: ruff check
        entry: uv run --extra dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pytest
        name: pytest (requires Postgres on DATABASE_URL)
        # `uv run` resolves the project environment itself, so the hook works
        # without a virtualenv being activated first.
        entry: uv run --extra dev pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
