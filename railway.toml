[build]
builder = "nixpacks"

[deploy]
# Single instance: migrate then serve in one command (no migration race). Split this out
# (separate release step + locking) before scaling to multiple instances.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
