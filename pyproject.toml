[project]
name = "fmsc"
version = "0.1.0"
description = "Real-time absolute auction service"
authors = [{ name = "Eri Wiana", email = "eriwiana@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
    "uvicorn",
    # Ed25519, for Discord's interaction signatures. Not optional the way redis is: Discord
    # refuses to register an interactions endpoint that does not verify them — it sends
    # deliberately bad signatures during validation and expects a 401 — so the slash
    # command does not work without it, and hand-rolling the curve arithmetic to save a
    # dependency is not a trade anybody should take.
    "pynacl>=1.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout>=2.4.0",
    # Pinned, and the only pin: the pre-commit hook runs this one through `uv run` rather
    # than fetching its own copy, so a formatter that changes its mind cannot disagree with
    # itself between a local commit and CI.
    "ruff==0.16.10",
    # So `uv run pre-commit install` works from a fresh clone without anything global.
    "pre-commit",
]
redis = [
    "redis>=8.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hang is a failure, not a lost run. Three times in this project a missing message or an
# uncancellable task has parked the suite forever — an uncancellable closer, a socket with
# no snapshot, an unreleased row lock — and each cost a killed run to notice. The timeout
# turns all of them into a traceback pointing at the line that waited.
timeout = 60
timeout_method = "thread"

# One tool in place of isort + flake8 + three flake8 plugins + black. Settings live here,
# not only in the workflow, so a local `ruff check` and CI agree.
[tool.ruff]
line-length = 100
# Pin the target: left to guess, a formatter targets the newest Python it knows.
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, C4 comprehensions, SIM simplify,
# C901 mccabe — the same ground flake8 and its three plugins covered.
#
# Two beyond it. BLE: a swallowed exception is the bug class M2 hit, where the closer
# caught its own cancellation and became uncancellable. RUF100: an inert `noqa` is worse
# than none, because it claims a rule is firing when it is not — the F401 on alembic's
# `import app.models` had been lying since M0, and this is what found it.
select = ["E", "W", "F", "I", "B", "C4", "SIM", "C901", "BLE", "RUF100"]
# The formatter owns line length; the lint rule would only duplicate it and disagree
# about strings and comments it cannot wrap.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# timedelta and similar are immutable, so calling them in a default is safe (B008).
extend-immutable-calls = ["datetime.timedelta", "timedelta"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; the revision identifiers are module-level assignments it formats
# its own way, and E402 fires on the imports it puts after the docstring.
"alembic/versions/*" = ["E402"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Migrations are generated and the app factory is an entry point; counting them
# flatters the number without testing anything.
omit = ["alembic/*", "app/main.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# Measured baseline, not an aspiration. 97.91% after M8, and the same number three runs
# running: the wobble the note below describes has gone, because the lines it came from are
# now the only uncovered ones and they are uncovered every time.
#
# Treat an unstable number as a missing test rather than something to average out. Every
# wobble here has been a line no test called, which coverage credited some of the time.
#
# Litestar's test client runs the app in a portal thread that coverage does not always
# trace, so some socket lines are exercised by passing tests and credited unevenly. Not a
# gap in the tests, so do not go looking for one.
#
# What remains genuinely uncovered is the idempotency key's lost race, which needs two
# writers inside one transaction, one unreachable return in the socket handler, four of
# app/auth.py's own error paths, and two re-raises kept so the next constraint added to a
# table is not swallowed and reported as a refusal.
#
# M11 adds two of its own, both deliberate: the fallthrough refusal at the end of each of
# app/settlement.py's two _explain helpers. The guards above them are the whole WHERE clause
# of the statement each one explains, so neither is reachable today. They are kept so that a
# guard added to a statement without a matching reason is a refusal rather than a 500.
#
# M12 adds two more of the portal-thread kind, in app/edge.py: the two lines that hand a
# non-HTTP scope straight on. A WebSocket and a lifespan both take that branch and
# test_a_socket_passes_through_the_wrapper_untouched drives it, but litestar's test client
# runs the socket in a portal thread and coverage does not credit it through a plain ASGI
# wrapper. Exercised, not traced; the same reason tests/test_e2e.py drives the Litestar
# application rather than the wrapper.
#
# One more that is traced rather than untested: the handler behind link_discord's
# uq_community_discord_guild_id refusal is reported uncovered although
# test_a_guild_cannot_be_linked_to_two_communities drives it and a hand-run against the
# database answered the 409. Treat it as the portal-thread case above, not as a gap.
#
# Ratchet up as tests land, never down.
fail_under = 97

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
