[project]
name = "fmsc"
version = "0.1.0"
description = "Real-time absolute auction service"
authors = [{ name = "Eri Wiana", email = "eriwiana@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Line length lives here, not only in the workflow, so a local `black .` and CI agree.
[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
# Pin the target: without it black formats for the newest Python it knows and then
# fails its own AST safety check when run on 3.12.
target-version = ["py312"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Migrations are generated and the app factory is an entry point; counting them
# flatters the number without testing anything.
omit = ["alembic/*", "app/main.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# Measured baseline on the day CI landed, not an aspiration. The target is 90%;
# M1 adds the missing money-path and closer tests and raises this with them.
# (62, not 63: the measured figure is 62.93% and fail_under does not round up.)
# Ratchet it up as tests land, never down to make a change pass.
fail_under = 62

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
