[project]
name = "fmsc"
version = "0.1.0"
description = "Real-time absolute auction service"
authors = [{ name = "Eri Wiana", email = "eriwiana@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Line length lives here, not only in the workflow, so a local `black .` and CI agree.
[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
# Pin the target: without it black formats for the newest Python it knows and then
# fails its own AST safety check when run on 3.12.
target-version = ["py312"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Migrations are generated and the app factory is an entry point; counting them
# flatters the number without testing anything.
omit = ["alembic/*", "app/main.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# Measured baseline, not an aspiration. 90.04%, flat across 6 runs — the 90% target, met.
#
# Treat an unstable number as a missing test rather than something to average out. Every
# wobble here has been a line no test called, which coverage credited some of the time.
#
# The socket's 4401 close is exercised by a passing test but never credited: litestar's
# test client runs the app in a portal thread that coverage does not trace. Not a gap in
# the tests, so do not go looking for one.
#
# What remains genuinely uncovered is most of app/auth.py's error paths, which M7 covers,
# and create_auction's two validation branches. Ratchet up as tests land, never down.
fail_under = 90

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
