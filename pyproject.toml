[project]
name = "fmsc"
version = "0.1.0"
description = "Real-time absolute auction service"
authors = [{ name = "Eri Wiana", email = "eriwiana@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
