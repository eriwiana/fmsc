[project]
name = "fmsc"
version = "0.1.0"
description = "Real-time absolute auction service"
authors = [{ name = "Eri Wiana", email = "eriwiana@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]",
    "advanced-alchemy",
    "asyncpg",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Line length lives here, not only in the workflow, so a local `black .` and CI agree.
[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
# Pin the target: without it black formats for the newest Python it knows and then
# fails its own AST safety check when run on 3.12.
target-version = ["py312"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Migrations are generated and the app factory is an entry point; counting them
# flatters the number without testing anything.
omit = ["alembic/*", "app/main.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# Measured baseline, not an aspiration. The target is 90%; what is left uncovered is
# the auth handlers and the websocket, which M3 covers.
#
# The 65.93/66.37 wobble that forced the previous floor down is gone: it was a line in
# run_closer, which no test called, and four consecutive runs now measure 72.37%.
# Ratchet it up as tests land, never down to make a change pass.
fail_under = 72

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
