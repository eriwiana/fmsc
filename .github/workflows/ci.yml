name: CI

on:
  pull_request:
  push:
    branches: [main]

# A rapid second push supersedes the first instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite talks to the same engine production does; a sqlite pass is a
  # convenience, not the contract.
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fmsc

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          # .python-version, not pyproject: setup-python reads requires-python as a
          # range and picks the NEWEST match, which silently ran CI on 3.14.
          python-version-file: .python-version
      # Over the whole repo, not the changed files: a pre-commit hook only
      # formats what a commit touches, so a file nobody has edited since the
      # formatter changed its mind drifts silently.
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fmsc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Only the socket suite uses it, and only to prove the fan-out backend is
        # interchangeable. Nothing else in CI needs Redis running.
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          # .python-version, not pyproject: setup-python reads requires-python as a
          # range and picks the NEWEST match, which silently ran CI on 3.14.
          python-version-file: .python-version

      - name: Install
        run: uv sync --extra dev --extra redis --locked

      - name: Compile
        run: uv run python -m compileall -q app alembic tests

      - name: App boots
        run: uv run python -c "import app.main"

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Migrations match models
        # An autogenerate that still has something to say means a model changed
        # without a migration.
        run: uv run alembic check

      - name: Tests
        # The floor lives in pyproject, so a local run gates identically.
        run: uv run pytest --cov --cov-report=term-missing

      # M5 criterion 4: the same socket suite, against each fan-out backend. The default
      # is in-memory and single-instance; these are the two that let several processes see
      # each other's events, and a backend nobody runs the suite against is a backend
      # nobody knows works.
      - name: Sockets over Redis
        env:
          CHANNELS_URL: redis://localhost:6379/0
        run: uv run pytest --no-cov -q tests/test_e2e.py

      - name: Sockets over Postgres LISTEN/NOTIFY
        env:
          CHANNELS_URL: postgresql://postgres:postgres@localhost:5432/fmsc
        run: uv run pytest --no-cov -q tests/test_e2e.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Production is built from this file, so a broken one fails here and not at
      # deploy time. `uv sync --locked` inside it fails the build if uv.lock has
      # drifted from pyproject.toml, which is what keeps production on the lock.
      - name: Build the production image
        run: docker build -t fmsc:ci .

      - name: Image interpreter matches .python-version
        # The base image tag states the version a second time. This is what stops the
        # two drifting apart.
        run: |
          want=$(cat .python-version)
          got=$(docker run --rm fmsc:ci python -V | cut -d' ' -f2)
          case "$got" in
            "$want".*) echo "image runs $got, .python-version says $want" ;;
            *) echo "::error::image runs $got but .python-version says $want"; exit 1 ;;
          esac
